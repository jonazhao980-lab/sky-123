<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="会议听力"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7EAED" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#14191F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>会议听力训练</title>
<link rel="stylesheet" href="style.css">
</head>
<body><div class="wrap">
<header><div>
  <label class="lesson-pick zh"><span>课程</span><select id="lessonSel" aria-label="选择课程"></select></label>
  <h1 id="title">会议听力训练</h1>
  <p class="sub zh" id="intro"></p></div>
  <div class="swatches" id="swatches" aria-label="说话人"></div></header>

<section class="today zh" aria-label="今日进度">
<div class="streak"><b id="streakN">0</b><span>天连续打卡</span></div>
<div><div class="meter"><i id="goalFill"></i></div><span id="goalTxt"></span><div class="dots" id="dots" aria-label="最近 14 天"></div></div>
<div class="acts"><button class="btn primary big" id="startToday">开始今天的练习</button><button class="btn" id="commute">通勤模式：连播全场</button></div>
</section>
<p class="status zh"><span id="offline">正在准备离线版…</span> · <button class="linkbtn" id="syncBtn">同步：未开启</button></p>

<div class="bar">
<div class="modes" role="group" aria-label="练习模式">
<button data-mode="blind" class="zh">盲听</button><button data-mode="intensive" class="zh">精听</button><button data-mode="dictation" class="zh">填空</button><button data-mode="wrong" class="zh">错词本<span id="wrongBadge"></span></button><button data-mode="quiz" class="zh">理解题</button><button data-mode="vocab" class="zh">词汇</button></div>
<div class="ctrl"><button class="btn zh" id="playAll">播放本节</button><button class="btn zh" id="stop">停止</button>
<select id="rate" aria-label="语速"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select>
<label class="tg zh"><input type="checkbox" id="showZh">中文</label><label class="tg zh"><input type="checkbox" id="auto" checked>自动连播</label></div>
<audio id="au" controls preload="metadata" playsinline style="width:100%"></audio>
</div>
<div class="main"><nav class="sections" id="nav" aria-label="会议章节"></nav><section id="content" aria-live="polite"><p class="hint zh">加载中…</p></section></div>
<footer class="zh" id="note"></footer>
</div>

<dialog id="syncDlg" class="zh">
<form method="dialog">
<h3>手机和电脑同步进度</h3>
<div id="syncOff">
  <p>不用注册账号。在一台设备上点"生成同步码"，再把同步码输入到另一台设备，两边的打卡和错词本就会自动合并。</p>
  <p><button type="button" class="btn primary" id="syncNew">生成同步码</button></p>
  <p>已经有同步码？<br><input id="syncIn" placeholder="xxxx-xxxx-xxxx-xxxx-xxxx" autocomplete="off" autocapitalize="off" spellcheck="false"> <button type="button" class="btn" id="syncJoin">使用</button></p>
</div>
<div id="syncOn" hidden>
  <p>同步已开启。你的同步码：</p>
  <p><code id="syncCode"></code> <button type="button" class="btn" id="syncCopy">复制</button></p>
  <p class="hint">在另一台设备打开本页 → 点"同步" → 输入这个码。同步码相当于密码，别发给别人。</p>
  <p><button type="button" class="btn" id="syncNow">立即同步</button> <button type="button" class="btn" id="syncOffBtn">在本设备关闭同步</button></p>
  <p class="hint" id="syncMsg"></p>
</div>
<p class="hint" style="border-top:1px solid var(--line);padding-top:10px">想从头开始？<button type="button" class="linkbtn" id="resetBtn" style="font-size:14px">清空所有进度</button></p>
<p><button class="btn">关闭</button></p>
</form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
