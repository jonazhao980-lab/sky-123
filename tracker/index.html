<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKY 市场部开发项目进度看板</title>
<style>
  :root {
    --surface-0: #f5f4f0;
    --surface-1: #eeece5;
    --surface-2: #ffffff;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #dedcd3;
    --border-strong: #c7c4b8;
    --radius: 8px;
    --accent-bg: #e6f1fb;
    --accent-text: #0c447c;
    --green-bg: #eaf3de;
    --green-text: #27500a;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --purple-bg: #eeedfe;
    --purple-text: #3c3489;
    --gray-bg: #f1efe8;
    --gray-text: #5f5e5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--surface-0);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(230, 241, 251, 0.7) 0%, transparent 38%),
      radial-gradient(circle at 92% 8%, rgba(238, 237, 254, 0.6) 0%, transparent 34%),
      radial-gradient(circle at 88% 82%, rgba(234, 243, 222, 0.6) 0%, transparent 38%),
      radial-gradient(circle at 10% 88%, rgba(250, 238, 218, 0.6) 0%, transparent 34%);
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 1.5rem; display: flex; align-items: center; gap: 10px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-text); flex-shrink: 0; }
  .sync-dot.offline { background: var(--amber-text); }
  input, button {
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
  }
  input[type="text"], input[type="password"] { height: 36px; padding: 0 10px; }
  button {
    height: 36px;
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  .icon-x { font-size: 16px; line-height: 1; color: var(--text-muted); }
  .icon-edit { font-size: 14px; line-height: 1; color: var(--text-muted); }
  .icon-plus { font-size: 18px; line-height: 1; color: var(--text-muted); }
  .project-note { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px; }
  .editable { cursor: text; border-radius: 4px; padding: 1px 4px; margin: -1px -4px; }
  .editable:hover { background: var(--surface-1); }
  .inline-edit-input { font-size: inherit; font-weight: inherit; font-style: normal; padding: 1px 4px; height: auto; width: 100%; }
  .badge {
    display: inline-block;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: var(--radius);
    white-space: nowrap;
  }
  .status-select {
    font-size: 12px;
    height: auto;
    padding: 2px 6px;
    border: none;
    font-weight: 500;
    cursor: pointer;
  }
  .add-row { display: flex; gap: 6px; margin-top: 10px; }
  .add-row input { flex: 1; }
  .loading { color: var(--text-muted); font-size: 14px; }
  .back-link { font-size: 13px; color: var(--text-muted); text-decoration: none; margin-bottom: 10px; display: inline-block; }
  .back-link:hover { color: var(--text-primary); }
  .search-row { margin-bottom: 1rem; }
  .search-row input { width: 100%; }

  .view-tabs { display: flex; gap: 8px; margin-bottom: 1.2rem; }
  .view-tab-btn {
    height: 34px;
    padding: 0 16px;
    border-radius: 999px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: auto;
  }
  .view-tab-btn.active { background: var(--text-primary); color: #fff; border-color: var(--text-primary); }
  .view-tab-btn:hover:not(.active) { background: var(--surface-1); }

  .overview-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .overview-toolbar select { height: 34px; width: auto; }
  .overview-toolbar button { width: auto; padding: 0 14px; font-size: 13px; }
  .overview-table-wrap { overflow-x: auto; border-radius: 12px; border: 0.5px solid var(--border); }
  .overview-table { width: 100%; min-width: 720px; border-collapse: collapse; background: var(--surface-2); }
  .overview-table th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
    white-space: nowrap;
  }
  .overview-table th.sortable { cursor: pointer; user-select: none; }
  .overview-table th.sortable:hover { color: var(--text-primary); }
  .overview-table td { padding: 8px 10px; border-bottom: 1px solid var(--surface-1); font-size: 13px; vertical-align: middle; }
  .overview-table tr:last-child td { border-bottom: none; }
  .overview-table input, .overview-table select { font-size: 13px; height: 32px; width: 100%; }
  .ov-name { font-weight: 500; cursor: pointer; min-width: 160px; white-space: nowrap; }
  .ov-name:hover { text-decoration: underline; }
  .overview-table tr.overdue-row { background: #fdf0ef; }
  .overview-table tr.overdue-row td { border-bottom-color: #f6dedc; }
  .overview-table tr.overdue-row td:first-child { border-left: 3px solid #b3261e; }
  .overview-table tr:not(.overdue-row) td:first-child { border-left: 3px solid transparent; }
  .ov-overdue-tag { color: #b3261e; font-size: 11px; font-weight: 600; margin-left: 6px; white-space: nowrap; }
  .overview-empty { text-align: center; color: var(--text-muted); padding: 2.5rem 0; font-size: 13px; }

  #lock-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .lock-card {
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .lock-card h2 { font-size: 16px; font-weight: 500; margin: 0 0 1.2rem; }
  .lock-card input { width: 100%; text-align: center; margin-bottom: 10px; }
  .lock-card button.unlock-btn {
    width: 100%;
    background: var(--text-primary);
    color: #fff;
    height: 36px;
    border: none;
  }
  .lock-card button.unlock-btn:hover { opacity: 0.9; background: var(--text-primary); }
  .lock-error { color: #b3261e; font-size: 13px; margin: 8px 0 0; min-height: 16px; }
  #main-app { display: none; }

  .clickable { cursor: pointer; }
  .clickable:hover { text-decoration: underline; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(28, 28, 26, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .modal-card {
    background: var(--surface-2);
    border-radius: 14px;
    width: min(94vw, 1020px);
    max-height: 92vh;
    overflow-y: auto;
    padding: 2rem 2.5rem 2.5rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 1.6rem; }
  .modal-header-main { flex: 1; min-width: 0; }
  .modal-title { font-size: 21px; font-weight: 600; word-break: break-word; }
  .modal-title-edit-input {
    font-size: 21px;
    font-weight: 600;
    width: 100%;
    padding: 2px 6px;
    margin: -2px 0 0 -6px;
    border-radius: 6px;
    border: 0.5px solid var(--border-strong);
    font-family: inherit;
    color: var(--text-primary);
    background: var(--surface-2);
  }
  .modal-subtitle input {
    width: 100%;
    font-size: 13px;
    height: 28px;
    border: none;
    background: transparent;
    padding: 0 4px;
    margin: 2px 0 0 -4px;
    color: var(--text-secondary);
  }
  .modal-subtitle input:hover, .modal-subtitle input:focus { background: var(--surface-1); border-radius: 6px; }
  .modal-close { flex-shrink: 0; }
  .modal-section { margin-bottom: 2rem; }
  .modal-section-title { font-size: 14.5px; font-weight: 600; color: var(--text-secondary); margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 12px; }
  @media (max-width: 640px) { .info-grid { grid-template-columns: 1fr; } }
  .info-field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .info-field input { width: 100%; font-size: 14px; height: 36px; }
  .info-field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
    min-height: 64px;
    line-height: 1.5;
  }
  .bg-field label { display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 3px; }
  .note-field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
    min-height: 64px;
    line-height: 1.6;
  }
  .bg-field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
    min-height: 160px;
    line-height: 1.6;
  }
  .website-field { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .website-field label { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
  .website-field input { flex: 1; font-size: 14px; height: 36px; }
  .website-open-btn {
    font-size: 13px;
    color: var(--accent-text);
    background: var(--accent-bg);
    padding: 0 14px;
    height: 36px;
    display: flex;
    align-items: center;
    border-radius: var(--radius);
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .website-open-btn:hover { opacity: 0.85; }
  .followup-add { display: flex; gap: 8px; margin-bottom: 14px; }
  .followup-add textarea {
    flex: 1;
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
    min-height: 44px;
  }
  .followup-add button { align-self: flex-end; width: auto; padding: 0 16px; height: 40px; }
  .followup-list { display: flex; flex-direction: column; gap: 10px; }
  .followup-entry {
    background: var(--surface-1);
    border-radius: 8px;
    padding: 10px 12px;
    position: relative;
  }
  .followup-time { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .followup-content { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; padding-right: 52px; }
  .followup-edit-input {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.6;
    padding: 8px 10px;
    border-radius: 6px;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    resize: vertical;
    min-height: 44px;
  }
  .followup-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; }
  .followup-edit-btn, .followup-del {
    width: 22px;
    height: 22px;
    background: transparent;
    border: none;
  }
  .followup-edit-btn:hover, .followup-del:hover { background: var(--surface-2); }
  .followup-empty { font-size: 13px; color: var(--text-muted); }

  .contact-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .contact-card { display: flex; align-items: flex-start; gap: 10px; background: var(--surface-1); border-radius: 10px; padding: 10px 12px; }
  .contact-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent-bg); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 600; flex-shrink: 0;
  }
  .contact-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .contact-input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  @media (max-width: 480px) { .contact-input-row { grid-template-columns: 1fr; } }
  .contact-input-row input { width: 100%; font-size: 13px; height: 32px; background: var(--surface-2); }
  .contact-name-input { font-weight: 600; }
  .contact-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .primary-badge {
    font-size: 11px; padding: 2px 8px; border-radius: var(--radius);
    background: var(--gray-bg); color: var(--gray-text); white-space: nowrap;
    border: none; height: auto; cursor: pointer;
  }
  .primary-badge.active { background: var(--amber-bg); color: var(--amber-text); }
  .contact-add-row { display: flex; gap: 6px; }
  .contact-add-row input { flex: 1; }

  .next-action-banner {
    background: var(--amber-bg);
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .next-action-banner label { font-size: 12.5px; color: var(--amber-text); font-weight: 600; white-space: nowrap; }
  .next-action-banner input[type="date"] { height: 30px; font-size: 12.5px; background: #fff; }
  .next-action-banner input[type="text"] { flex: 1; min-width: 140px; height: 30px; font-size: 13px; background: #fff; }

  .fu-box { background: var(--surface-2); border: 0.5px solid var(--border); border-left: 3px solid var(--gray-text); border-radius: 12px; padding: 0.8rem 1.1rem; margin: 0 0 12px; }
  .fu-box.g-A { border-left-color: #b3261e; }
  .fu-box.g-B { border-left-color: var(--amber-text); }
  .fu-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .fu-box.g-A .fu-title { color: #b3261e; }
  .fu-count { font-size: 12px; font-weight: 600; background: var(--surface-1); color: var(--text-secondary); border-radius: 999px; padding: 1px 9px; }
  .fu-due { font-size: 12px; font-weight: 600; color: #b3261e; }
  .fu-desc { font-size: 11.5px; font-weight: 400; color: var(--text-muted); }
  .fu-list { max-height: 320px; overflow-y: auto; }
  .today-inbox-link { display: block; margin: 18px 0 8px; text-align: right; }
  .today-empty { font-size: 13px; color: var(--text-muted); padding: 4px 6px; }

  .stage-pill { font-size: 11px; background: var(--purple-bg); color: var(--purple-text); border-radius: 999px; padding: 0 8px; margin-left: 4px; white-space: nowrap; }
  .channel-tag { font-size: 11px; background: var(--accent-bg); color: var(--accent-text); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .modal-latest { font-size: 13px; color: var(--text-secondary); background: var(--surface-1); border-radius: 8px; padding: 8px 12px; margin: -0.6rem 0 1.4rem; line-height: 1.6; }
  .info-field select {
    width: 100%; height: 36px; font-family: inherit; font-size: 14px; padding: 0 10px;
    border-radius: var(--radius); border: 0.5px solid var(--border-strong);
    background: var(--surface-2); color: var(--text-primary);
  }
  .followup-add select { height: 40px; align-self: flex-end; font-family: inherit; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); padding: 0 6px; }

  .type-pill { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-left: 4px; white-space: nowrap; }
  .type-pill.t-A { background: #fdf0ef; color: #b3261e; }
  .type-pill.t-B { background: var(--amber-bg); color: var(--amber-text); }
  .type-pill.t-C { background: var(--gray-bg); color: var(--gray-text); }
  .type-pill.t-auto { background: var(--accent-bg); color: var(--accent-text); }
  .type-pill.t-done { background: var(--green-bg); color: var(--green-text); }
  .reply-tag { font-size: 11px; background: #fdf0ef; color: #b3261e; border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .reply-check { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--text-secondary); align-self: flex-end; height: 40px; white-space: nowrap; cursor: pointer; }
  .reply-check input { width: auto; height: auto; }
  .follow-type-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-1); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .follow-type-box label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .follow-type-box select { height: 34px; font-family: inherit; font-size: 13.5px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); padding: 0 8px; }
  .follow-type-hint { font-size: 12.5px; color: var(--text-secondary); }
  .search-count { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .search-hit { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .search-hit:hover { border-color: var(--border-strong); }
  .search-hit-top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .search-hit-name { font-size: 15px; font-weight: 600; }
  .search-hit-path { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  .search-hit-line { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; word-break: break-word; }
  .search-hit-line.muted { color: var(--text-muted); }
  .search-hit-ups { margin-top: 8px; border-top: 0.5px solid var(--border); padding-top: 6px; }
  .search-hit-up { font-size: 12.5px; color: var(--text-primary); padding: 2px 0; word-break: break-word; }
  .search-hit-date { color: var(--text-muted); margin-right: 4px; }

  /* ===== 界面改版：项目横排卡片 + 展开面板 + 精简客户行 ===== */
  .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .proj-tile { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 96px; transition: border-color .15s; }
  .proj-tile:hover { border-color: var(--border-strong); }
  .proj-tile.active { border-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent-text) inset; }
  .proj-tile-name { font-size: 14.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .proj-tile-meta { font-size: 12.5px; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
  .proj-due { font-size: 11.5px; color: var(--amber-text); background: var(--amber-bg); border-radius: 999px; padding: 0 8px; }
  .proj-tile-status { font-size: 11.5px; color: var(--text-muted); margin-top: auto; }
  .proj-hint { font-size: 13px; color: var(--text-muted); margin: 6px 2px 16px; }
  .proj-panel { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .proj-panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .proj-panel-title { font-size: 16px; font-weight: 600; flex: 1; min-width: 160px; }
  .proj-panel-actions { display: flex; gap: 2px; }
  .project-note { font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; }
  button.ghost { height: 28px; width: auto; padding: 0 10px; font-size: 12px; color: var(--text-muted); background: transparent; border: none; }
  button.ghost:hover { background: var(--surface-1); color: var(--text-primary); }
  button.ghost.danger:hover { color: #b3261e; }
  button.ghost:disabled { opacity: .3; cursor: default; background: transparent; }
  .cust-list { display: flex; flex-direction: column; margin-bottom: 4px; }
  .cust-row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 8px; border-top: 0.5px solid var(--surface-1); cursor: pointer; border-radius: 8px; }
  .cust-row:first-child { border-top: none; }
  .cust-row:hover { background: var(--surface-0); }
  .cust-main { min-width: 0; flex: 1; }
  .cust-name { font-size: 14px; font-weight: 500; }
  .cust-latest { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cust-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; font-size: 12px; color: var(--text-muted); }
  .cust-status { color: var(--text-secondary); }
  .cust-due { color: var(--amber-text); font-weight: 500; }
  .muted-line { font-size: 13px; color: var(--text-muted); padding: 8px; }
  .muted-inline { font-size: 12px; color: var(--text-muted); }
  .sub-section { margin-top: 14px; padding-top: 10px; border-top: 0.5px dashed var(--border-strong); }
  .sub-title { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
  .sub-title .cnt { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .proj-add, .add-sub { margin-top: 10px; }
  @media (max-width: 640px) { .cust-row { flex-direction: column; gap: 6px; } .cust-side { align-items: flex-start; } }

  .today-inbox-link { font-size: 12.5px; font-weight: 500; color: var(--accent-text); cursor: pointer; }
  .today-row.hot { background: #fff6e8; border-left: 3px solid #e08a00; padding-left: 8px; }
  .today-row.hot.waiting { background: #fffaf1; }
  .today-when.soon { color: var(--text-muted); background: var(--surface-1); }
  .today-row.hot:hover { background: #ffefd2; }
  .today-row.hot .today-name { color: #b3261e; font-weight: 700; }
  .hot-badge { font-size: 11.5px; font-weight: 700; color: #fff; background: #e08a00; border-radius: 4px; padding: 0 7px; white-space: nowrap; }
  .today-proj { font-size: 12px; color: var(--text-muted); }

  .inbox-badge { background: #b3261e; color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; margin-left: 6px; }
  .view-tab-btn.active .inbox-badge { background: #e8685f; }
  .inbox-intro { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
  .inbox-empty { text-align: center; padding: 3rem 0; font-size: 15px; color: var(--text-secondary); line-height: 2; }
  .inbox-empty span { font-size: 12.5px; color: var(--text-muted); }
  .inbox-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; font-size: 13.5px; position: sticky; bottom: 12px; }
  .inbox-bar select { height: 34px; width: auto; min-width: 200px; font-family: inherit; font-size: 13.5px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); padding: 0 8px; }
  .primary-btn { height: 34px; width: auto; padding: 0 18px; background: var(--text-primary); color: #fff; border: none; font-size: 13.5px; }
  .primary-btn:hover { opacity: .9; background: var(--text-primary); }
  .chip { height: 26px; width: auto; padding: 0 10px; font-size: 12px; border-radius: 999px; background: var(--accent-bg); color: var(--accent-text); border: none; cursor: pointer; }
  .modal-footer { display: flex; justify-content: flex-end; margin-top: 1rem; padding-top: 0.8rem; border-top: 0.5px solid var(--border); }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-card">
    <h2>请输入团队密码</h2>
    <input type="password" id="pwd-input" placeholder="密码" onkeydown="if(event.key==='Enter') unlock()" />
    <button class="unlock-btn" onclick="unlock()">进入看板</button>
    <p class="lock-error" id="lock-error"></p>
  </div>
</div>

<div id="main-app">
  <div class="wrap">
    <a class="back-link" href="../">← 返回工作台首页</a>
    <h1><span class="sync-dot offline" id="sync-dot"></span>SKY 市场部开发项目进度看板</h1>
    <a class="today-inbox-link" id="today-inbox-link" onclick="switchView('inbox')" hidden></a>
    <div id="fu-boxes"></div>
    <div class="view-tabs">
      <button class="view-tab-btn active" id="tab-board" onclick="switchView('board')">看板</button>
      <button class="view-tab-btn" id="tab-overview" onclick="switchView('overview')">🚚 拖车总览</button>
      <button class="view-tab-btn" id="tab-inbox" onclick="switchView('inbox')">📥 待归类<span class="inbox-badge" id="inbox-badge" hidden>0</span></button>
    </div>
    <div class="main-content" id="board-view">
      <div class="search-row">
        <input type="text" id="search-input" placeholder="搜索客户/项目名称…" oninput="onSearch(this.value)" />
      </div>
      <div id="app"><p class="loading">加载中…</p></div>
    </div>
    <div id="overview-view" style="display:none;">
      <div id="overview"></div>
    </div>
    <div id="inbox-view" style="display:none;">
      <div id="inbox"></div>
    </div>
  </div>
</div>

<div id="customer-modal" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// 数据存储在 Supabase（多人共享的云端数据库），不再使用 localStorage。
// 用一个团队共享账号做登录门槛：Row Level Security 只允许已登录（authenticated）用户读写数据。
const SUPABASE_URL = 'https://lnfnstmhxuaxeubjxjiu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yLkQNC-S0Y03ebDV5UNOPA_WpYzVkp9';
const TEAM_EMAIL = 'team@customer-dev-tracker.app';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_STYLE = {
  '待启动': { bg: 'var(--gray-bg)', text: 'var(--gray-text)' },
  '市场调研': { bg: 'var(--gray-bg)', text: 'var(--gray-text)' },
  '进行中': { bg: 'var(--accent-bg)', text: 'var(--accent-text)' },
  '已发-待回复': { bg: 'var(--accent-bg)', text: 'var(--accent-text)' },
  '待发': { bg: 'var(--amber-bg)', text: 'var(--amber-text)' },
  '沟通报价中': { bg: 'var(--amber-bg)', text: 'var(--amber-text)' },
  '已结案': { bg: 'var(--green-bg)', text: 'var(--green-text)' },
  '衍生线索': { bg: 'var(--purple-bg)', text: 'var(--purple-text)' },
};

function badge(text) {
  const key = Object.keys(STATUS_STYLE).find(k => text.includes(k)) || '进行中';
  const s = STATUS_STYLE[key];
  return `<span class="badge" style="background:${s.bg}; color:${s.text};">${text}</span>`;
}

function statusSelect(current, onChangeCall) {
  const key = Object.keys(STATUS_STYLE).find(k => current.includes(k)) || '进行中';
  const s = STATUS_STYLE[key];
  const options = Object.keys(STATUS_STYLE).map(k =>
    `<option value="${k}" ${k === current ? 'selected' : ''}>${k}</option>`
  ).join('');
  return `<select class="status-select" style="background:${s.bg}; color:${s.text};" onclick="event.stopPropagation()" onchange="event.stopPropagation(); ${onChangeCall}">${options}</select>`;
}

let projects = [];
let activeId = null; // 当前展开的项目/子项目 id（本地浏览器临时状态，同一时间只有一个的客户面板打开）
let realtimeSubscribed = false;
let searchTerm = '';

// ---- 拖车项目（p1）专属：跟进状态 + 总览页 ----
const TRAILER_PROJECT_ID = 'p1';
const OUTREACH_STATUSES = ['待发', '已发-等待中', '已退信-换人中', '一周无回应-升级中', '已转同事跟进', '客户已回应', '冷却暂缓', '已成交'];
let currentView = 'board'; // 'board' | 'overview'
let overviewClusterFilter = '';
let overviewSortDir = 'asc';

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function switchView(view) {
  currentView = view;
  ['board', 'overview', 'inbox'].forEach(v => {
    document.getElementById('tab-' + v).classList.toggle('active', view === v);
    document.getElementById(v + '-view').style.display = view === v ? 'block' : 'none';
  });
  if (view === 'overview') renderOverview();
  if (view === 'inbox') renderInbox();
}

function outreachStatusSelect(itemId, current) {
  const options = OUTREACH_STATUSES.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s}</option>`).join('');
  return `<select onchange="saveItemField('${itemId}', 'outreach_status', this.value)"><option value="" ${!current ? 'selected' : ''}>—</option>${options}</select>`;
}

function renderOverview() {
  const box = document.getElementById('overview');
  if (!box) return;
  const trailerProject = projects.find(p => p.id === TRAILER_PROJECT_ID);
  const items = trailerProject ? trailerProject.items : [];
  const today = todayStr();

  const clusters = Array.from(new Set(items.map(it => it.cluster).filter(Boolean))).sort();

  let list = overviewClusterFilter ? items.filter(it => it.cluster === overviewClusterFilter) : items.slice();
  list.sort((a, b) => {
    const ad = a.next_action_date || '9999-99-99';
    const bd = b.next_action_date || '9999-99-99';
    const cmp = ad.localeCompare(bd);
    return overviewSortDir === 'asc' ? cmp : -cmp;
  });

  box.innerHTML = `
    <div class="overview-toolbar">
      <select onchange="overviewClusterFilter = this.value; renderOverview();">
        <option value="">全部集群</option>
        ${clusters.map(c => `<option value="${escAttr(c)}" ${overviewClusterFilter === c ? 'selected' : ''}>${escHtml(c)}</option>`).join('')}
      </select>
      <button onclick="overviewSortDir = overviewSortDir === 'asc' ? 'desc' : 'asc'; renderOverview();">按下次跟进日期排序 ${overviewSortDir === 'asc' ? '▲' : '▼'}</button>
    </div>
    <div class="overview-table-wrap">
      <table class="overview-table">
        <thead>
          <tr><th>公司名</th><th>集群</th><th>当前状态</th><th class="sortable" onclick="overviewSortDir = overviewSortDir === 'asc' ? 'desc' : 'asc'; renderOverview();">下次跟进日期</th><th>负责人</th></tr>
        </thead>
        <tbody>
          ${list.length === 0
            ? `<tr><td colspan="5" class="overview-empty">还没有客户，去"看板"里新增拖车客户</td></tr>`
            : list.map(it => {
              const overdue = it.next_action_date && it.next_action_date <= today;
              return `
                <tr class="${overdue ? 'overdue-row' : ''}">
                  <td class="ov-name" onclick="openCustomerModal('${it.id}')">${escHtml(it.name)}</td>
                  <td><input type="text" value="${escAttr(it.cluster)}" placeholder="—" onchange="saveItemField('${it.id}', 'cluster', this.value)" /></td>
                  <td>${outreachStatusSelect(it.id, it.outreach_status)}</td>
                  <td style="display:flex; align-items:center; gap:4px;">
                    <input type="date" style="flex:1;" value="${it.next_action_date || ''}" onchange="saveItemField('${it.id}', 'next_action_date', this.value || null)" />
                    ${overdue ? `<span class="ov-overdue-tag">⚠ 逾期</span>` : ''}
                  </td>
                  <td><input type="text" value="${escAttr(it.assignee)}" placeholder="—" onchange="saveItemField('${it.id}', 'assignee', this.value)" /></td>
                </tr>
              `;
            }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ---- 新客户待归类收件箱：拿不准归哪个项目的客户先放这里，你勾选后统一归类 ----
let inboxSelected = new Set();
let inboxTarget = '';

function projectOptionsHTML(selectedId, withInbox) {
  const opts = [];
  if (withInbox) opts.push(`<option value="${INBOX_ID}" ${selectedId === INBOX_ID ? 'selected' : ''}>📥 待归类收件箱</option>`);
  visibleProjects().forEach(p => {
    opts.push(`<option value="${p.id}" ${selectedId === p.id ? 'selected' : ''}>${escHtml(p.name)}</option>`);
    (p.subProjects || []).forEach(sp => opts.push(`<option value="${sp.id}" ${selectedId === sp.id ? 'selected' : ''}>${escHtml(p.name)} › ${escHtml(sp.name)}</option>`));
  });
  return opts.join('');
}

function renderInbox() {
  const items = inboxItems();
  const badge = document.getElementById('inbox-badge');
  badge.textContent = items.length;
  badge.hidden = items.length === 0;
  const link = document.getElementById('today-inbox-link');
  link.hidden = items.length === 0;
  link.textContent = `📥 有 ${items.length} 位新客户待归类 →`;

  const box = document.getElementById('inbox');
  if (!box || currentView !== 'inbox') return;
  inboxSelected = new Set([...inboxSelected].filter(id => items.some(i => i.id === id)));
  if (items.length === 0) {
    box.innerHTML = `<div class="inbox-empty">📭 没有待归类的客户。<br><span>新客户来源明确的会直接进对应项目；拿不准的会先放在这里等你确认。</span></div>`;
    return;
  }
  const nameOf = id => { const n = findProjectNode(id); return n ? n.name : ''; };
  box.innerHTML = `
    <div class="inbox-intro">这些新客户还没归到项目里，但<b>已经正常参与"今日待跟进"</b>。勾选后统一归入某个项目；"推测归属"只是参考。</div>
    <div class="overview-table-wrap">
      <table class="overview-table">
        <thead><tr>
          <th style="width:36px;"><input type="checkbox" ${inboxSelected.size === items.length ? 'checked' : ''} onchange="toggleInboxAll(this.checked)" /></th>
          <th>客户 / 公司</th><th>国家 · 来源线索</th><th>推测归属</th><th>类型</th>
        </tr></thead>
        <tbody>
          ${items.map(it => `
            <tr>
              <td><input type="checkbox" ${inboxSelected.has(it.id) ? 'checked' : ''} onchange="toggleInboxSel('${it.id}', this.checked)" /></td>
              <td class="ov-name" onclick="openCustomerModal('${it.id}')">${escHtml(it.name)}${it.company ? `<div class="muted-inline">${escHtml(it.company)}</div>` : ''}</td>
              <td>${escHtml([it.country, it.source, it.industry_tag].filter(Boolean).join(' · ') || '—')}</td>
              <td>${it.suggested_project && nameOf(it.suggested_project)
                ? `<button class="chip" title="点一下：选中这位，并把目标项目设为它" onclick="pickSuggested('${it.id}', '${it.suggested_project}')">${escHtml(nameOf(it.suggested_project))}</button>`
                : '<span class="muted-inline">无法判断</span>'}</td>
              <td>${typePill(it)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="inbox-bar">
      已选 <b>${inboxSelected.size}</b> 位，归入
      <select onchange="inboxTarget = this.value">
        <option value="">选择项目…</option>${projectOptionsHTML(inboxTarget, false)}
      </select>
      <button class="primary-btn" onclick="moveInboxSelected()">确认归类</button>
    </div>`;
}

function toggleInboxSel(id, on) { on ? inboxSelected.add(id) : inboxSelected.delete(id); renderInbox(); }
function toggleInboxAll(on) { inboxSelected = new Set(on ? inboxItems().map(i => i.id) : []); renderInbox(); }
function pickSuggested(id, projectId) { inboxSelected.add(id); inboxTarget = projectId; renderInbox(); }

async function moveInboxSelected() {
  const ids = [...inboxSelected];
  if (!ids.length) { alert('请先勾选要归类的客户'); return; }
  if (!inboxTarget) { alert('请选择要归入的项目'); return; }
  const target = findProjectNode(inboxTarget);
  const names = inboxItems().filter(i => inboxSelected.has(i.id)).map(i => '· ' + i.name).join('\n');
  if (!confirm(`把选中的 ${ids.length} 位客户归入「${target ? target.name : ''}」？\n\n${names}`)) return;
  const { error } = await sb.from('items').update({ project_id: inboxTarget }).in('id', ids);
  if (error) { alert('归类失败：' + error.message); return; }
  inboxSelected = new Set();
  await load();
}

async function moveCustomer(id, projectId) {
  const { error } = await sb.from('items').update({ project_id: projectId }).eq('id', id);
  if (error) { alert('保存失败：' + error.message); return; }
  await load();
  renderModal();
}

function onSearch(value) {
  searchTerm = value.trim().toLowerCase();
  render();
}

async function unlock() {
  const pwd = document.getElementById('pwd-input').value;
  const errEl = document.getElementById('lock-error');
  errEl.textContent = '';
  if (!pwd) return;
  const { error } = await sb.auth.signInWithPassword({ email: TEAM_EMAIL, password: pwd });
  if (error) {
    errEl.textContent = '密码错误，请重试';
    return;
  }
  showApp();
}

function showApp() {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  load();
  if (!realtimeSubscribed) {
    realtimeSubscribed = true;
    sb.channel('public:board')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'follow_ups' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'contacts' }, load)
      .subscribe();
  }
}

async function load() {
  const [{ data: projs, error: e1 }, { data: items, error: e2 }, { data: allFollowUps }, { data: allContacts }] = await Promise.all([
    sb.from('projects').select('*').order('sort_order'),
    sb.from('items').select('*').order('sort_order'),
    sb.from('follow_ups').select('*').order('created_at', { ascending: false }),
    sb.from('contacts').select('*').order('sort_order'),
  ]);
  const dot = document.getElementById('sync-dot');
  if (e1 || e2) {
    dot.classList.add('offline');
    document.getElementById('app').innerHTML = `<p class="loading">连接数据库失败，请检查网络或联系管理员。</p>`;
    return;
  }
  dot.classList.remove('offline');
  const followUpsByItem = {};
  (allFollowUps || []).forEach(f => {
    if (!followUpsByItem[f.item_id]) followUpsByItem[f.item_id] = [];
    followUpsByItem[f.item_id].push(f); // 已按时间倒序，最新在前
  });
  const contactsByItem = {};
  (allContacts || []).forEach(c => {
    if (!contactsByItem[c.item_id]) contactsByItem[c.item_id] = [];
    contactsByItem[c.item_id].push(c);
  });
  const byId = {};
  (projs || []).forEach(p => {
    byId[p.id] = {
      ...p,
      items: (items || [])
        .filter(it => it.project_id === p.id)
        .map(it => ({
          ...it,
          latestFollowup: (followUpsByItem[it.id] || [])[0] || null,
          followUps: followUpsByItem[it.id] || [],
          contacts: contactsByItem[it.id] || [],
        }))
        .sort(sortItems),
      subProjects: [],
    };
  });
  const roots = [];
  Object.values(byId).forEach(p => {
    if (p.parent_project_id && byId[p.parent_project_id]) {
      byId[p.parent_project_id].subProjects.push(p);
    } else {
      roots.push(p);
    }
  });
  roots.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  Object.values(byId).forEach(p => p.subProjects.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)));
  projects = roots;
  render();
  renderToday();
  renderInbox();
  if (currentView === 'overview') renderOverview();
}

function statusTier(status) {
  if (status === '已结案') return 2;
  if (status === '待启动') return 1;
  return 0;
}

function sortItems(a, b) {
  const tierDiff = statusTier(a.status) - statusTier(b.status);
  if (tierDiff !== 0) return tierDiff;
  const aDate = a.last_contact || '';
  const bDate = b.last_contact || '';
  if (aDate !== bDate) return bDate.localeCompare(aDate);
  return (a.sort_order || 0) - (b.sort_order || 0);
}

function getWeekRange(ref) {
  const now = ref || new Date();
  const day = now.getDay();
  const diffToMonday = day === 0 ? 6 : day - 1;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMonday, 0, 0, 0, 0);
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6, 23, 59, 59, 999);
  return { start, end };
}

function fmtMD(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

// ---- 项目：横排卡片 + 点开后在下方展开客户清单 ----
const INBOX_ID = 'inbox';   // "待归类收件箱"：一个特殊项目，不显示成项目卡片

function visibleProjects() { return projects.filter(p => p.id !== INBOX_ID); }
function inboxItems() { const p = projects.find(x => x.id === INBOX_ID); return p ? p.items : []; }

function projectCounts(p) {
  const items = p.items.concat(...(p.subProjects || []).map(sp => sp.items));
  const today = todayStr();
  return { total: items.length, due: items.filter(it => it.next_action_date && it.next_action_date <= today && isTracked(it)).length };
}

function tileHTML(p) {
  const c = projectCounts(p);
  return `
    <div class="proj-tile ${activeId === p.id ? 'active' : ''}" onclick="toggleProj('${p.id}')">
      <div class="proj-tile-name">${escHtml(p.name)}</div>
      <div class="proj-tile-meta"><span>${c.total} 位客户</span>${c.due ? `<span class="proj-due">今日 ${c.due}</span>` : ''}</div>
      <div class="proj-tile-status">${escHtml(p.status || '')}</div>
    </div>`;
}

function customerRowHTML(it) {
  const today = todayStr();
  const due = it.next_action_date && it.next_action_date <= today && isTracked(it);
  const diff = due ? Math.round((new Date(today + 'T00:00:00') - new Date(it.next_action_date + 'T00:00:00')) / 86400000) : 0;
  const latest = it.latestFollowup ? truncate(it.latestFollowup.content, 100) : (it.note || '');
  return `
    <div class="cust-row" onclick="openCustomerModal('${it.id}')">
      <div class="cust-main">
        <div class="cust-name">${escHtml(it.name)}${typePill(it)}${it.stage ? `<span class="stage-pill">${escHtml(it.stage)}</span>` : ''}</div>
        <div class="cust-latest">${latest ? escHtml(latest) : '<span class="muted-inline">暂无跟进记录</span>'}</div>
      </div>
      <div class="cust-side">
        <span class="cust-status">${escHtml(it.status)}</span>

// ---- 客户资料常量、搜索（公司/邮箱/联系人/背景/跟进内容）、查重、今日待跟进 ----
const STAGES = ['询盘', '报价中', '谈判', '已成交', '夭折', '沉睡'];
// 跟进规则引擎：A 有意向(3天) / B 间歇回复(7天) / C 沉睡或没回(15天→30天) / 已成交、已转交（不跟踪）
const FOLLOW_TYPES = [
  { v: 'A', label: 'A 有意向/在谈（3天）' },
  { v: 'B', label: 'B 间歇回复（7天）' },
  { v: 'C', label: 'C 沉睡/没回（15→30天）' },
  { v: '已成交', label: '已成交（不跟踪）' },
  { v: '已转交', label: '已转交（不跟踪）' },
];
function effType(it) { return it.follow_type || 'C'; }   // 空 = 未分类，按 C 处理
// 「百型」软件代发阶段：跟进记录全是"百型代发"，客户还没回复、本人也没跟进过 → 只记录，不提醒、不算逾期
function isBaixingAuto(it) {
  const f = it.followUps || [];
  return f.length > 0 && f.every(x => x.channel === '百型代发');
}
function isTracked(it) {
  return !['已成交', '已转交'].includes(effType(it)) && it.status !== '已结案' &&
    !['已成交', '夭折'].includes(it.stage) && it.outreach_status !== '已成交' && !isBaixingAuto(it);
}
function typePill(it) {
  if (isBaixingAuto(it)) return `<span class="type-pill t-auto" title="百型软件在自动触达，只记录、不提醒；客户一回复就自动升 A 类">百型触达</span>`;
  const t = effType(it);
  const label = t === 'A' || t === 'B' || t === 'C' ? t + '类' : t;
  return `<span class="type-pill t-${t === '已成交' || t === '已转交' ? 'done' : t}">${label}</span>`;
}
function followAdvice(it, daysSince) {
  const t = effType(it);
  const quiet = daysSince == null ? '还没联系过' : daysSince === 0 ? '今天刚联系' : `${daysSince}天没回`;
  if (daysSince == null) return `${quiet}，首次触达`;
  return t === 'A' ? `${quiet}，问进展` : t === 'B' ? `${quiet}，发跟进信` : `${quiet}，轻触达保持联系`;
}
const SOURCES = ['展会', '老客户', '询盘', '名片', '其他'];
const CHANNELS = ['邮件', 'WhatsApp', '电话', '会议', '其他'];

function allItemsWithProject() {
  const out = [];
  projects.forEach(p => {
    p.items.forEach(it => out.push(it));
    (p.subProjects || []).forEach(sp => sp.items.forEach(it => out.push(it)));
  });
  return out;
}

function projectPath(projectId) {
  for (const p of projects) {
    if (p.id === projectId) return p.name;
    const sp = (p.subProjects || []).find(s => s.id === projectId);
    if (sp) return `${p.name} › ${sp.name}`;
  }
  return '';
}

function itemSearchText(it) {
  return [
    it.name, it.company, it.note, it.background, it.country, it.industry_tag, it.source_channel,
    it.pain_points, it.key_note, it.website, it.hq_address, it.partners, it.recent_activity,
    ...(it.contacts || []).flatMap(c => [c.name, c.title, c.email, c.phone]),
    ...(it.followUps || []).map(f => f.content),
    projectPath(it.project_id),
  ].filter(Boolean).join('\n').toLowerCase();
}

const GENERIC_TOKENS = new Set(['group', 'panel', 'panels', 'metal', 'metals', 'steel', 'trade', 'trading', 'sign', 'signs', 'tech', 'alum', 'aluminium', 'aluminum', 'aluminio', 'global', 'world', 'international', 'intl', 'industries', 'industrial', 'solutions', 'systems', 'materials', 'building', 'plastics', 'facade', 'facades', 'europe', 'euro', 'china', 'mexico', 'brasil', 'brazil', 'usa', 'america', 'american', 'north', 'south']);
const LEGAL_TOKENS = new Set(['llc', 'ltd', 'limited', 'inc', 'corp', 'co', 'gmbh', 'kg', 'sa', 'de', 'cv', 'sl', 'srl', 'spa', 'bv', 'ab', 'oy', 'ag', 'pty', 'pte', 'the']);
function normName(s) {
  const t = String(s || '').toLowerCase()
    .replace(/（[^）]*）|\([^)]*\)/g, ' ')
    .replace(/[^a-z0-9一-龥]+/g, ' ').trim();
  return t.split(' ').filter(w => w && !LEGAL_TOKENS.has(w)).join(' ');
}

// 查重：新增客户前与已有客户的名称/公司比对（名称相同、互相包含、或首个单词相同）
function findSimilarCustomers(name) {
  const n = normName(name);
  if (n.length < 3) return [];
  const firstTok = n.split(' ')[0];
  return allItemsWithProject().filter(it => [it.name, it.company].some(x => {
    const m = normName(x);
    if (!m) return false;
    if (m === n || (n.length >= 4 && m.includes(n)) || (m.length >= 4 && n.includes(m))) return true;
    return firstTok.length >= 4 && !GENERIC_TOKENS.has(firstTok) && m.split(' ')[0] === firstTok;
  }));
}

// 今日待跟进：下次跟进日期 ≤ 今天，且客户还没成交/夭折/结案
function renderToday() {
  const box = document.getElementById('fu-boxes');
  if (!box) return;
  const today = todayStr();
  const todayMs = new Date(today + 'T00:00:00').getTime();
  const tracked = allItemsWithProject().filter(isTracked);
  const typeOf = it => (effType(it) === 'A' ? 'A' : effType(it) === 'B' ? 'B' : 'C');
  const isDue = it => it.next_action_date && it.next_action_date <= today;
  const byDate = (a, b) => (a.next_action_date || '9999').localeCompare(b.next_action_date || '9999');
  // 每类一个框：到期（待跟进）的排最上面，逾期最久的最前；A 类没到期的"等待中"排在后面，不让重点客户消失
  const due = tracked.filter(isDue).sort(byDate);
  const waitingA = tracked.filter(it => typeOf(it) === 'A' && !isDue(it)).sort(byDate);
  const waitingRow = it => {
    const days = it.next_action_date ? Math.round((new Date(it.next_action_date + 'T00:00:00') - todayMs) / 86400000) : null;
    return `
      <div class="today-row hot waiting" onclick="openCustomerModal('${it.id}')">
        <span class="today-when soon">${days == null ? '等待中' : `${days}天后`}</span>
        <span class="hot-badge">⭐ 重点跟</span>
        <span class="today-name">${escHtml(it.name)}</span>
        <span class="today-proj">${escHtml(projectPath(it.project_id))}</span>
        ${typePill(it)}
        <span class="today-action">→ ${escHtml(it.next_action_note || '保持关注，等对方回复')}</span>
      </div>`;
  };
  const dueHtml = due.map(it => {
    const diff = Math.round((todayMs - new Date(it.next_action_date + 'T00:00:00').getTime()) / 86400000);
    const lastDays = it.last_contact ? Math.floor((todayMs - new Date(it.last_contact + 'T00:00:00').getTime()) / 86400000) : null;
    const note = it.next_action_note ? `｜${it.next_action_note}` : '';
    const hot = effType(it) === 'A';
    return `
      <div class="today-row ${diff > 0 ? 'late' : ''} ${hot ? 'hot' : ''}" onclick="openCustomerModal('${it.id}')">
        <span class="today-when">${diff === 0 ? '今日' : `逾期${diff}天`}</span>
        ${hot ? '<span class="hot-badge">⭐ 重点跟</span>' : ''}
        <span class="today-name">${escHtml(it.name)}</span>
        <span class="today-proj">${escHtml(projectPath(it.project_id))}</span>
        ${typePill(it)}
        <span class="today-action">→ ${escHtml(followAdvice(it, lastDays) + note)}</span>
      </div>`;
  });
  const dueOf = type => due.map((it, i) => ({ it, html: dueHtml[i] })).filter(x => typeOf(x.it) === type).map(x => x.html);
  const boxHtml = (type, title, desc, rows, dueN) => `
    <div class="fu-box g-${type}">
      <div class="fu-title">${title}
        <span class="fu-count">${rows.length}</span>
        ${dueN ? `<span class="fu-due">${dueN} 个待跟进</span>` : ''}
        <span class="fu-desc">${desc}</span>
      </div>
      <div class="fu-list">${rows.length ? rows.join('') : '<div class="today-empty">暂无</div>'}</div>
    </div>`;
  const aDue = dueOf('A'), bDue = dueOf('B'), cDue = dueOf('C');
  box.innerHTML =
    boxHtml('A', '⭐ A 类 · 重点跟', '客户有回复/有进展，3 天一轮', aDue.concat(waitingA.map(waitingRow)), aDue.length) +
    boxHtml('B', 'B 类', '我方跟进后没回，7 天一轮', bDue, bDue.length) +
    boxHtml('C', 'C 类', '长期培育，15 / 30 天一轮', cDue, cDue.length);
}

async function updateProjectStatus(id, status) {
  await sb.from('projects').update({ status }).eq('id', id);

}

function startInlineEdit(el, currentValue, { placeholder = '', multiline = false, onSave }) {
  const input = document.createElement(multiline ? 'textarea' : 'input');
  if (!multiline) input.type = 'text';
  input.value = currentValue;
  input.placeholder = placeholder;
  input.className = 'inline-edit-input';
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    if (save) {
      const val = input.value.trim();
      if (val !== currentValue) { await onSave(val); return; }
    }
    load();
  };
  input.onclick = (e) => e.stopPropagation();
  input.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Enter' && !multiline) { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
  el.replaceWith(input);
  input.focus();
  input.select();
}

function editProjectName(event, id, currentName) {
  startInlineEdit(event.target, currentName, {
    onSave: async (val) => {
      if (val) await sb.from('projects').update({ name: val }).eq('id', id);
      load();
    },
  });
}

function editProjectNameByButton(id, currentName) {
  const nameEl = document.getElementById('proj-title-' + id);
  if (!nameEl) return;
  startInlineEdit(nameEl, currentName, {
    onSave: async (val) => {
      if (val) await sb.from('projects').update({ name: val }).eq('id', id);
      load();
    },
  });
}

function toggleProj(id) {
  activeId = (activeId === id) ? null : id;
  render();
}

async function moveProject(id, dir) {
  const list = visibleProjects();
  const i = list.findIndex(p => p.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  await Promise.all(list.map((p, idx) => sb.from('projects').update({ sort_order: idx + 1 }).eq('id', p.id)));
  load();
}

async function addItem(id) {
  const input = document.getElementById('in-' + id);
  const val = input.value.trim();
  if (!val) return;
  const dup = findSimilarCustomers(val);
  if (dup.length && !confirm(`⚠️ 疑似与已有客户重叠：\n${dup.map(d => '· ' + d.name + '（' + projectPath(d.project_id) + '）').join('\n')}\n\n仍然要新增"${val}"吗？（取消=不新增，请先搜索确认）`)) return;
  input.value = '';
  const { error } = await sb.from('items').insert({ project_id: id, name: val, status: '进行中', note: '' });
  if (error) { alert('保存失败：' + error.message); return; }
  load();
}

async function deleteCustomerFromModal(itemId, itemName) {
  if (!confirm(`确定要删除客户"${itemName}"吗？它的联系人和全部跟进记录也会一起删除，无法恢复。`)) return;
  const { error } = await sb.from('items').delete().eq('id', itemId);
  if (error) { alert('删除失败：' + error.message); return; }
  closeCustomerModal();
  load();
}

function findProjectNode(id) {
  for (const p of projects) {
    if (p.id === id) return p;
    const sub = (p.subProjects || []).find(sp => sp.id === id);
    if (sub) return sub;
  }
  return null;
}

async function removeProject(projectId, projectName) {
  const p = findProjectNode(projectId);
  const itemCount = p ? p.items.length : 0;
  const subCount = p && p.subProjects ? p.subProjects.length : 0;
  const parts = [];
  if (itemCount > 0) parts.push(`${itemCount} 条客户/事项记录`);
  if (subCount > 0) parts.push(`${subCount} 个子项目（及其下属客户）`);
  const warning = parts.length > 0
    ? `确定要删除项目"${projectName}"吗？里面的 ${parts.join('、')} 也会一起被永久删除，无法恢复。`
    : `确定要删除项目"${projectName}"吗？删除后无法恢复。`;
  if (!confirm(warning)) return;
  const { error } = await sb.from('projects').delete().eq('id', projectId);
  if (error) { alert('删除失败：' + error.message); return; }
  load();
}

async function addProject() {
  const input = document.getElementById('new-project-input');
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  const maxOrder = visibleProjects().reduce((m, p) => Math.max(m, p.sort_order || 0), 0);
  const { error } = await sb.from('projects').insert({
    id: crypto.randomUUID(),
    name: val,
    status: '待启动',
    note: '',
    sort_order: maxOrder + 1,
  });
  if (error) { alert('保存失败：' + error.message); return; }
  load();
}

async function addSubProject(parentId) {
  const input = document.getElementById('sub-in-' + parentId);
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  const parent = projects.find(p => p.id === parentId);
  const maxOrder = (parent.subProjects || []).reduce((m, p) => Math.max(m, p.sort_order || 0), 0);
  const { error } = await sb.from('projects').insert({
    id: crypto.randomUUID(),
    name: val,
    status: '待启动',
    note: '',
    sort_order: maxOrder + 1,
    parent_project_id: parentId,
  });
  if (error) { alert('保存失败：' + error.message); return; }
  load();
}

// ---- 客户详情弹窗（公司背景 + 评分来源 + 对接人 + 跟进记录历史）----
let modalItemId = null;
let modalFollowUps = [];
let modalContacts = [];

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}
// 用于拼进单引号 JS 字符串字面量（如 onclick="fn('...')"）里的转义
function escJs(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
}

function truncate(s, n) {
  s = String(s || '');
  return s.length > n ? s.slice(0, n) + '…' : s;
}

function initials(name) {
  const s = String(name || '').trim();
  if (!s) return '?';
  const parts = s.split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return s.slice(0, 2).toUpperCase();
}

function normalizeUrl(url) {
  const s = String(url || '').trim();
  if (!s) return '#';
  if (/^https?:\/\//i.test(s)) return s;
  return 'https://' + s;
}

function findItemNode(id) {
  for (const p of projects) {
    const it = p.items.find(i => i.id === id);
    if (it) return it;
    for (const sp of (p.subProjects || [])) {
      const subIt = sp.items.find(i => i.id === id);
      if (subIt) return subIt;
    }
  }
  return null;
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadFollowUps(itemId) {
  const { data, error } = await sb.from('follow_ups').select('*').eq('item_id', itemId).order('created_at', { ascending: false });
  if (!error) modalFollowUps = data || [];
  renderModal();
}

async function loadContacts(itemId) {
  const { data, error } = await sb.from('contacts').select('*').eq('item_id', itemId)
    .order('is_primary', { ascending: false }).order('sort_order', { ascending: true });
  if (!error) modalContacts = data || [];
  renderModal();
}

function renderModal() {
  const box = document.getElementById('customer-modal');
  if (!modalItemId) { box.innerHTML = ''; return; }
  const it = findItemNode(modalItemId);
  if (!it) { closeCustomerModal(); return; }
  box.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeCustomerModal()">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-header-main">
            <div class="modal-title editable" title="双击修改名称" ondblclick="editModalTitle(event, '${it.id}', '${escJs(it.name)}')">${escHtml(it.name)}</div>
            <div class="modal-subtitle">
              <input type="text" value="${escAttr(it.industry_tag)}" placeholder="地区·行业标签，如：美国·幕墙/建筑板开发" onchange="saveItemField('${it.id}', 'industry_tag', this.value)" />
            </div>
          </div>
          ${statusSelect(it.status, `changeModalStatus('${it.id}', this.value)`)}
          <button class="modal-close" aria-label="关闭" onclick="closeCustomerModal()"><span class="icon-x">×</span></button>
        </div>

        <div class="modal-latest">
          ${(() => {
            const f = modalFollowUps[0];
            const next = it.next_action_note ? `　⏰ 下一步：${escHtml(it.next_action_note)}${it.next_action_date ? `（${it.next_action_date}）` : ''}` : '';
            if (!f) return `<b>最近动态：</b>暂无跟进记录${next}`;
            return `<b>最近动态：</b>${fmtDateTime(f.created_at).slice(0, 10)}${f.channel ? ` [${escHtml(f.channel)}]` : ''} ${escHtml(truncate(f.content, 110))}${next}`;
          })()}
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🧾 客户资料</div>
          <div class="follow-type-box">
            <label>所属项目</label>
            <select onchange="moveCustomer('${it.id}', this.value)">${projectOptionsHTML(it.project_id, true)}</select>
            <label style="margin-left:10px;">跟进类型</label>
            <select onchange="changeFollowType('${it.id}', this.value)">
              ${FOLLOW_TYPES.map(o => `<option value="${o.v}" ${effType(it) === o.v ? 'selected' : ''}>${o.label}</option>`).join('')}
            </select>
            <span class="follow-type-hint">${isBaixingAuto(it) ? '百型软件自动触达中，系统只记录、不提醒；客户一回复就自动升 A 类，进入今日待跟进' : isTracked(it)
              ? (it.next_action_date ? `下次跟进：<b>${it.next_action_date}</b>（系统按规则自动算）` : '下次跟进：第一次联系后自动开始计时')
              : '已退出跟进，不会出现在今日待跟进'}${it.follow_type || isBaixingAuto(it) ? '' : '　· 未分类，按 C 处理'}</span>
          </div>
          <div class="info-grid">
            <div class="info-field">
              <label>进展阶段</label>
              <select onchange="saveItemField('${it.id}', 'stage', this.value || null)">
                <option value="">—</option>
                ${STAGES.map(s => `<option value="${s}" ${it.stage === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div class="info-field">
              <label>来源</label>
              <select onchange="saveItemField('${it.id}', 'source', this.value || null)">
                <option value="">—</option>
                ${SOURCES.map(s => `<option value="${s}" ${it.source === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </div>
            <div class="info-field">
              <label>客户公司</label>
              <input type="text" value="${escAttr(it.company)}" placeholder="公司全称（查重用）" onchange="saveItemField('${it.id}', 'company', this.value)" />
            </div>
            <div class="info-field">
              <label>国家</label>
              <input type="text" value="${escAttr(it.country)}" placeholder="如：墨西哥" onchange="saveItemField('${it.id}', 'country', this.value)" />
            </div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">📝 备注</div>
          <div class="note-field">
            <textarea placeholder="一句话备注（客户卡片上没有跟进记录时会显示这里）" onchange="saveItemField('${it.id}', 'note', this.value)">${escHtml(it.note)}</textarea>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🏢 公司背景</div>
          <div class="bg-field">
            <textarea placeholder="公司背景、产品线、需求等" onchange="saveItemField('${it.id}', 'background', this.value)">${escHtml(it.background)}</textarea>
          </div>
          <div class="website-field">
            <label>🔗 官网</label>
            <input type="text" value="${escAttr(it.website)}" placeholder="https://example.com" onchange="saveItemField('${it.id}', 'website', this.value)" />
            ${it.website ? `<a class="website-open-btn" href="${escAttr(normalizeUrl(it.website))}" target="_blank" rel="noopener">访问 ↗</a>` : ''}
          </div>
          <div class="info-grid">
            <div class="info-field">
              <label>总部地址</label>
              <textarea placeholder="总部地址" onchange="saveItemField('${it.id}', 'hq_address', this.value)">${escHtml(it.hq_address)}</textarea>
            </div>
            <div class="info-field">
              <label>分仓</label>
              <textarea placeholder="分仓/仓库分布" onchange="saveItemField('${it.id}', 'warehouses', this.value)">${escHtml(it.warehouses)}</textarea>
            </div>
            <div class="info-field">
              <label>合作伙伴</label>
              <textarea placeholder="合作伙伴/供应商" onchange="saveItemField('${it.id}', 'partners', this.value)">${escHtml(it.partners)}</textarea>
            </div>
            <div class="info-field">
              <label>近期动态</label>
              <textarea placeholder="近期动态" onchange="saveItemField('${it.id}', 'recent_activity', this.value)">${escHtml(it.recent_activity)}</textarea>
            </div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">💡 痛点与重点提示</div>
          <div class="info-grid">
            <div class="info-field">
              <label>客户痛点 / 为什么可能选我们</label>
              <textarea placeholder="一句话即可" onchange="saveItemField('${it.id}', 'pain_points', this.value)">${escHtml(it.pain_points)}</textarea>
            </div>
            <div class="info-field">
              <label>重点提示</label>
              <textarea placeholder="如：墨西哥NO.1拖车制造商 / 不要提已查到的LinkedIn背景" onchange="saveItemField('${it.id}', 'key_note', this.value)">${escHtml(it.key_note)}</textarea>
            </div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🎯 评分与标签</div>
          <div class="info-grid">
            <div class="info-field">
              <label>评分</label>
              <input type="number" min="0" max="10" value="${it.score != null ? it.score : ''}" placeholder="0-10 分" onchange="saveItemField('${it.id}', 'score', this.value ? Number(this.value) : null)" />
            </div>
            <div class="info-field">
              <label>标签</label>
              <input type="text" value="${escAttr(it.source_channel)}" placeholder="标签" onchange="saveItemField('${it.id}', 'source_channel', this.value)" />
            </div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">👥 对接人</div>
          <div class="contact-list">
            ${modalContacts.length === 0
              ? `<div class="followup-empty">还没有添加对接人</div>`
              : modalContacts.map(c => `
                <div class="contact-card">
                  <div class="contact-avatar">${initials(c.name)}</div>
                  <div class="contact-body">
                    <div class="contact-input-row">
                      <input type="text" class="contact-name-input" value="${escAttr(c.name)}" placeholder="姓名" onchange="saveContactField('${c.id}', 'name', this.value)" />
                      <input type="text" value="${escAttr(c.title)}" placeholder="职位" onchange="saveContactField('${c.id}', 'title', this.value)" />
                    </div>
                    <div class="contact-input-row">
                      <input type="text" value="${escAttr(c.email)}" placeholder="邮箱" onchange="saveContactField('${c.id}', 'email', this.value)" />
                      <input type="text" value="${escAttr(c.phone)}" placeholder="电话/WhatsApp" onchange="saveContactField('${c.id}', 'phone', this.value)" />
                    </div>
                  </div>
                  <div class="contact-actions">
                    <button class="primary-badge ${c.is_primary ? 'active' : ''}" onclick="setPrimaryContact('${c.id}', '${it.id}')">${c.is_primary ? '★ 主对接人' : '设为主对接人'}</button>
                    <button aria-label="删除" onclick="deleteContact('${c.id}')"><span class="icon-x">×</span></button>
                  </div>
                </div>
              `).join('')}
          </div>
          <div class="contact-add-row">
            <input type="text" id="new-contact-name" placeholder="新增对接人姓名" onkeydown="if(event.key==='Enter') addContact('${it.id}')" />
            <button onclick="addContact('${it.id}')"><span class="icon-plus">+</span></button>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-title">🗒 跟进记录</div>
          <div class="followup-add">
            <select id="followup-channel" title="沟通方式">
              ${CHANNELS.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
            <label class="reply-check" title="客户回了信/有新进展就勾上：系统会把客户升回 A 类（3天后再跟）；不勾 = 我方跟进、客户还没回">
              <input type="checkbox" id="followup-from-customer"> 客户回复
            </label>
            <textarea id="followup-input" placeholder="记录本次跟进内容，如：发了邮件，介绍了产品报价，等待回复"></textarea>
            <button onclick="addFollowUp()"><span class="icon-plus">+</span></button>
          </div>
          <div class="followup-list">
            ${modalFollowUps.length === 0
              ? `<div class="followup-empty">还没有跟进记录</div>`
              : modalFollowUps.map(f => { const escContent = escJs(f.content); return `
                <div class="followup-entry">
                  <div class="followup-time">${fmtDateTime(f.created_at)}${f.channel ? `<span class="channel-tag">${escHtml(f.channel)}</span>` : ''}${f.from_customer ? `<span class="reply-tag">客户回复</span>` : ''}</div>
                  <div class="followup-content" id="followup-content-${f.id}" title="双击也可修改" ondblclick="editFollowUpEntry(event, '${f.id}', '${escContent}')">${escHtml(f.content)}</div>
                  <div class="followup-actions">
                    <button aria-label="编辑" onclick="editFollowUpEntry(event, '${f.id}', '${escContent}', true)"><span class="icon-edit">✎</span></button>
                    <button class="followup-del" aria-label="删除" onclick="deleteFollowUp('${f.id}')"><span class="icon-x">×</span></button>
                  </div>
                </div>
              `; }).join('')}
          </div>
          <div class="next-action-banner">
            <label title="日期由系统按规则自动算，也可以手动改成特定日期">⏰ 下次跟进</label>
            <input type="date" value="${it.next_action_date || ''}" onchange="saveItemField('${it.id}', 'next_action_date', this.value || null)" />
            <input type="text" value="${escAttr(it.next_action_note)}" placeholder="下次要做什么" onchange="saveItemField('${it.id}', 'next_action_note', this.value)" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="ghost danger" onclick="deleteCustomerFromModal('${it.id}', '${escJs(it.name)}')">删除此客户</button>
        </div>
      </div>
    </div>
  `;
}

async function changeModalStatus(id, status) {
  const { error } = await sb.from('items').update({ status }).eq('id', id);
  if (error) { alert('保存失败：' + error.message); return; }
  await load();
  renderModal();
}

function editModalTitle(event, id, currentName) {
  event.stopPropagation();
  const el = event.target;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'modal-title-edit-input';
  input.value = currentName;
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    if (save) {
      const val = input.value.trim();
      if (val && val !== currentName) {
        const { error } = await sb.from('items').update({ name: val }).eq('id', id);
        if (error) alert('保存失败：' + error.message);
      }
    }
    await load();
    renderModal();
  };
  input.onclick = (e) => e.stopPropagation();
  input.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
  el.replaceWith(input);
  input.focus();
  input.select();
}

async function addContact(itemId) {
  const input = document.getElementById('new-contact-name');
  const val = input.value.trim();
  if (!val) return;
  input.value = '';
  const maxOrder = modalContacts.reduce((m, c) => Math.max(m, c.sort_order || 0), 0);
  const { error } = await sb.from('contacts').insert({
    item_id: itemId, name: val, sort_order: maxOrder + 1, is_primary: modalContacts.length === 0,
  });
  if (error) { alert('保存失败：' + error.message); return; }
  await loadContacts(itemId);
}

async function deleteContact(id) {
  if (!confirm('确定要删除这位对接人吗？删除后无法恢复。')) return;
  const { error } = await sb.from('contacts').delete().eq('id', id);
  if (error) { alert('删除失败：' + error.message); return; }
  await loadContacts(modalItemId);
}

async function setPrimaryContact(contactId, itemId) {
  await sb.from('contacts').update({ is_primary: false }).eq('item_id', itemId);
  const { error } = await sb.from('contacts').update({ is_primary: true }).eq('id', contactId);
  if (error) alert('保存失败：' + error.message);
  await loadContacts(itemId);
}

async function saveContactField(contactId, field, value) {
  if (field === 'name' && !value.trim()) { alert('姓名不能为空'); await loadContacts(modalItemId); return; }
  const { error } = await sb.from('contacts').update({ [field]: value }).eq('id', contactId);
  if (error) { alert('保存失败：' + error.message); return; }
  await loadContacts(modalItemId);
}

async function saveItemField(itemId, field, value) {
  const { error } = await sb.from('items').update({ [field]: value }).eq('id', itemId);
  if (error) { alert('保存失败：' + error.message); return; }
  await load();
}

async function addFollowUp() {
  const input = document.getElementById('followup-input');
  const val = input.value.trim();
  if (!val) return;
  const channel = document.getElementById('followup-channel').value;
  const fromCustomer = document.getElementById('followup-from-customer').checked;
  // 最近联系日期、跟进类型、下次跟进日期由数据库触发器按规则自动更新
  const { error } = await sb.from('follow_ups').insert({ item_id: modalItemId, content: val, channel, from_customer: fromCustomer });
  if (error) { alert('保存失败：' + error.message); return; }
  await load();
  await loadFollowUps(modalItemId);
}

async function changeFollowType(id, type) {
  // 改类型后，数据库按新类型重新算下次跟进日期
  const { error } = await sb.from('items').update({ follow_type: type }).eq('id', id);
  if (error) { alert('保存失败：' + error.message); return; }
  await load();
  renderModal();
}

async function deleteFollowUp(id) {
  if (!confirm('确定要删除这条跟进记录吗？删除后无法恢复。')) return;
  const { error } = await sb.from('follow_ups').delete().eq('id', id);
  if (error) { alert('删除失败：' + error.message); return; }
  await loadFollowUps(modalItemId);
  load();
}

function editFollowUpEntry(event, id, currentContent, fromButton) {
  // 不复用 startInlineEdit：它结束时只刷新看板列表（load），不会重绘弹窗，
  // 跟进记录的编辑框在弹窗里，需要单独处理，确保取消/保存后弹窗都能正确刷新。
  event.stopPropagation();
  const el = fromButton ? document.getElementById('followup-content-' + id) : event.target;
  if (!el) return;
  const textarea = document.createElement('textarea');
  textarea.className = 'followup-edit-input';
  textarea.value = currentContent;
  let done = false;
  const finish = async (save) => {
    if (done) return;
    done = true;
    if (save) {
      const val = textarea.value.trim();
      if (val && val !== currentContent) {
        const { error } = await sb.from('follow_ups').update({ content: val }).eq('id', id);
        if (error) alert('保存失败：' + error.message);
      }
    }
    await loadFollowUps(modalItemId);
    load();
  };
  textarea.onclick = (e) => e.stopPropagation();
  textarea.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Escape') finish(false);
  };
  textarea.onblur = () => finish(true);
  el.replaceWith(textarea);
  textarea.focus();
  textarea.select();
}

// 页面打开时先检查是否已经登录过（同一浏览器下次打开不用再输密码）
sb.auth.getSession().then(({ data }) => {
  if (data.session) showApp();
});
</script>
